<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0e0b16; --panel: #171226; --border: #2a2140;
      --text: #f0edf5; --muted: #8b84a3; --accent: #7c5cff;
      --green: #34d399; --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px; padding: 14px;
    }
    h1 { font-size: 15px; margin-bottom: 2px; }
    .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
    .status-bar {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 12px; font-size: 12px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.off { background: var(--red); }
    .row { margin-bottom: 12px; }
    label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    select {
      width: 100%; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 12px;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .range-val { color: var(--accent); font-weight: 600; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; }
    .switch-row span { color: var(--text); font-size: 12px; }
    .switch {
      position: relative; width: 40px; height: 22px; cursor: pointer;
    }
    .switch input { display: none; }
    .slider {
      position: absolute; inset: 0; background: #3a3154; border-radius: 22px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .btn {
      width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 9px; font-size: 13px; cursor: pointer; margin-top: 4px;
    }
    .btn:active { opacity: .85; }
    .btn.secondary { background: #2a2140; color: var(--text); margin-top: 8px; }
    .hint { color: var(--muted); font-size: 10px; margin-top: 6px; line-height: 1.5; }
    .hint code { background: var(--panel); padding: 1px 4px; border-radius: 3px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>
  <h1>🔊 NewsLiquid 高分播报</h1>
  <div class="sub">劫持页面推送 · 纯信号极速语音 · 不消耗你的 token</div>

  <div class="status-bar">
    <div class="dot" id="statusDot"></div>
    <div id="statusText" style="flex:1;">初始化…</div>
  </div>

  <div class="switch-row">
    <span>总开关</span>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>

  <div class="row">
    <label>最低 AI 评分：<span class="range-val" id="scoreVal">70</span></label>
    <input type="range" id="minScore" min="0" max="100" step="5" value="70">
  </div>

  <div class="grid2">
    <div class="row">
      <label>语速</label>
      <select id="rate">
        <option value="0.5">0.5倍（慢）</option>
        <option value="1">正常</option>
        <option value="1.5">较快</option>
        <option value="2" selected>2倍速</option>
        <option value="2.5">2.5倍</option>
        <option value="3">3倍速</option>
      </select>
    </div>
    <div class="row">
      <label>音量</label>
      <select id="volume">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
      </select>
    </div>
  </div>

  <div class="switch-row">
    <span>无标的新闻也播报（提取品种）</span>
    <label class="switch"><input type="checkbox" id="speakNoCoin" checked><span class="slider"></span></label>
  </div>

  <div class="row">
    <label>最多念几个标的：<span class="range-val" id="maxCoinsVal">3</span></label>
    <input type="range" id="maxCoins" min="1" max="5" step="1" value="3">
  </div>

  <button class="btn" id="testBtn">🔔 测试播报</button>
  <button class="btn secondary" id="openBtn">↗ 打开 NewsLiquid 交易页</button>

  <div class="hint">
    劫持模式：需先打开 <code>app.newsliquid.com/trade</code>，页面推送的新闻会自动语音播报。<br>
    使用<b>浏览器内置语音</b>（零延迟，不联网）。音色取决于系统安装的语音库。设置自动保存。
  </div>

  <script src="popup.js"></script>
</body>
</html>
